# Pings the Render services so free instances don't fall asleep while the
# project is being demoed/graded. Disable afterwards (Actions tab → this
# workflow → "Disable workflow") to save Render's 750 free hours per month.
name: Keep Render awake

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes (GitHub may delay runs a little)
  workflow_dispatch: {}       # "Run workflow" button for a manual wake-up

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake backend
        run: curl -fsS --retry 6 --retry-delay 10 --retry-all-errors --max-time 90 https://conzoomer.onrender.com/api/health
      - name: Wake storefront
        run: curl -fsS --retry 6 --retry-delay 10 --retry-all-errors --max-time 90 -o /dev/null https://conzoomer-shop.onrender.com/
